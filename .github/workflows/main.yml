package com.secretforge;

import net.minecraft.item.Item;
import net.minecraft.item.ItemPickaxe;
import net.minecraft.item.ItemSword;
import net.minecraft.item.Item.ToolMaterial;
import net.minecraftforge.event.RegistryEvent;
import net.minecraftforge.common.util.EnumHelper;

public class ModItems {
    public static final Item FRAGMENT = item("frontier_fragment");
    public static final Item CORE = item("ancient_core");
    public static final Item DUST = item("echo_dust");

    public static final ToolMaterial FRONTIER_MATERIAL =
        EnumHelper.addToolMaterial("FRONTIER", 3, 1850, 8.5F, 4.0F, 18);

    public static final Item SWORD = new ItemSword(FRONTIER_MATERIAL)
        .setRegistryName(SecretForge.MODID, "frontier_blade")
        .setUnlocalizedName(SecretForge.MODID + ".frontier_blade")
        .setCreativeTab(SecretForge.TAB);

    public static final Item PICKAXE = new ItemPickaxe(FRONTIER_MATERIAL)
        .setRegistryName(SecretForge.MODID, "frontier_pickaxe")
        .setUnlocalizedName(SecretForge.MODID + ".frontier_pickaxe")
        .setCreativeTab(SecretForge.TAB);

    private static Item item(String id) {
        return new Item().setRegistryName(SecretForge.MODID, id)
            .setUnlocalizedName(SecretForge.MODID + "." + id)
            .setCreativeTab(SecretForge.TAB);
    }

    public static void register(RegistryEvent.Register<Item> e) {
        e.getRegistry().registerAll(FRAGMENT, CORE, DUST, SWORD, PICKAXE);
    }
}

package com.secretforge;

import net.minecraft.block.Block;
import net.minecraft.block.material.Material;
import net.minecraft.creativetab.CreativeTabs;
import net.minecraft.item.Item;
import net.minecraft.item.ItemBlock;
import net.minecraft.item.ItemStack;
import net.minecraft.util.ResourceLocation;
import net.minecraftforge.event.RegistryEvent;
import net.minecraftforge.fml.common.Mod;
import net.minecraftforge.fml.common.event.FMLInitializationEvent;
import net.minecraftforge.fml.common.eventhandler.SubscribeEvent;
import net.minecraftforge.fml.common.registry.GameRegistry;

@Mod(modid = SecretForge.MODID, name = SecretForge.NAME, version = SecretForge.VERSION)
public class SecretForge {
    public static final String MODID = "secretforge";
    public static final String NAME = "Secret Frontier";
    public static final String VERSION = "1.0.0";

    public static final CreativeTabs TAB = new CreativeTabs(MODID) {
        @Override public ItemStack createIcon() {
            return new ItemStack(ModItems.FRAGMENT);
        }
    };

    @Mod.EventHandler
    public void init(FMLInitializationEvent event) {
        GameRegistry.addSmelting(ModBlocks.RAW_CRYSTAL, new ItemStack(ModItems.FRAGMENT, 2), 0.6f);
    }

    @Mod.EventBusSubscriber(modid = MODID)
    public static class Registration {
        @SubscribeEvent
        public static void registerItems(RegistryEvent.Register<Item> e) {
            ModItems.register(e);
            e.getRegistry().register(new ItemBlock(ModBlocks.RAW_CRYSTAL).setRegistryName(ModBlocks.RAW_CRYSTAL.getRegistryName()));
            e.getRegistry().register(new ItemBlock(ModBlocks.ALTAR).setRegistryName(ModBlocks.ALTAR.getRegistryName()));
        }

        @SubscribeEvent
        public static void registerBlocks(RegistryEvent.Register<Block> e) {
            e.getRegistry().registerAll(ModBlocks.RAW_CRYSTAL, ModBlocks.ALTAR);
        }
    }
}

package com.secretforge;

import net.minecraft.block.Block;
import net.minecraft.block.SoundType;
import net.minecraft.block.material.Material;

public class ModBlocks {
    public static final Block RAW_CRYSTAL = block("raw_crystal", 3.0F, 6.0F);
    public static final Block ALTAR = block("frontier_altar", 5.0F, 20.0F);

    private static Block block(String id, float hardness, float resistance) {
        return new Block(Material.ROCK)
            .setRegistryName(SecretForge.MODID, id)
            .setUnlocalizedName(SecretForge.MODID + "." + id)
            .setCreativeTab(SecretForge.TAB)
            .setHardness(hardness).setResistance(resistance)
            .setSoundType(SoundType.STONE);
    }
}

buildscript {
    repositories {
        maven { url = "https://maven.minecraftforge.net/" }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}
apply plugin: 'net.minecraftforge.gradle.forge'

version = "1.0.0"
group = "com.secretforge"
archivesBaseName = "SecretFrontier"

sourceCompatibility = targetCompatibility = '1.8'
compileJava.options.encoding = 'UTF-8'

minecraft {
    version = "1.12.2-14.23.5.2860"
    runDir = "run"
    mappings = "stable_39"
}

dependencies {}
processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version':project.version, 'mcversion':project.minecraft.version
    }
    from(sourceSets.main.resources.srcDirs) { exclude 'mcmod.info' }
}

org.gradle.jvmargs=-Xmx2G

