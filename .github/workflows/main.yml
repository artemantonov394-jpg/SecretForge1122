# Secret Frontier — Minecraft Forge 1.12.2

Полный исходный проект мода.

## Сборка
Нужен Java 8 и Gradle/ForgeGradle 2.3.
Команда: `gradlew build`

Готовый jar появится в `build/libs/`.

Мод специально сделан без внешних обязательных зависимостей.

